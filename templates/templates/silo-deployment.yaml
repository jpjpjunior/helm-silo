{{- include "silo.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "silo.fullname" . }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
    app.kubernetes.io/component: silo
spec:
  replicas: {{ .Values.silo.replicaCount }}
  strategy:
    type: {{ .Values.silo.updateStrategy }}
  selector:
    matchLabels:
      {{- include "silo.componentLabels" (dict "root" . "component" "silo") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "silo.componentLabels" (dict "root" . "component" "silo") | nindent 8 }}
        {{- with .Values.silo.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.silo.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "silo.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      # The Silo image's s6-overlay init MUST start as root and then drops
      # privileges to PUID:PGID itself — exactly how the compose stack runs
      # (no `user:`). Forcing runAsUser here makes the init abort with
      # "Started as uid ..., but this image's init needs root".
      # fsGroup still makes PVC mounts group-accessible for PGID.
      securityContext:
        fsGroup: {{ .Values.silo.pgid }}
        {{- if .Values.silo.nonRootMode }}
        runAsUser: {{ .Values.silo.puid }}
        runAsGroup: {{ .Values.silo.pgid }}
        runAsNonRoot: true
        {{- end }}
      # compose stop_grace_period: 2m
      terminationGracePeriodSeconds: {{ .Values.silo.terminationGracePeriodSeconds }}
      {{- if .Values.silo.transcode.nvidia.enabled }}
      runtimeClassName: {{ .Values.silo.transcode.nvidia.runtimeClassName }}
      {{- end }}
      {{- with .Values.silo.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.silo.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.silo.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.silo.initContainers.enabled }}
      initContainers:
        # compose depends_on: condition: service_healthy
        - name: wait-for-datastores
          image: {{ .Values.silo.initContainers.image }}
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - |
              {{- if .Values.postgres.enabled }}
              until nc -z -w2 {{ include "silo.fullname" . }}-postgres 5432; do echo "waiting for postgres..."; sleep 2; done
              {{- end }}
              {{- if or .Values.redis.enabled .Values.dragonfly.enabled }}
              {{- $cacheHost := printf "%s-%s" (include "silo.fullname" .) (.Values.dragonfly.enabled | ternary "dragonfly" "redis") }}
              until nc -z -w2 {{ $cacheHost }} 6379; do echo "waiting for cache backend..."; sleep 2; done
              {{- end }}
              echo "datastores are accepting connections"
      {{- end }}
      containers:
        - name: silo
          image: "{{ .Values.silo.image.repository }}:{{ .Values.silo.image.tag }}"
          imagePullPolicy: {{ .Values.silo.image.pullPolicy }}
          {{- if .Values.silo.nonRootMode }}
          # Skip the image's s6 init (which needs root) and start the silo
          # binary directly — the image's documented non-root escape hatch.
          # Requires silo.databaseUrlOverride (external PostgreSQL).
          command: [silo]
          {{- end }}
          {{- if .Values.silo.capabilities }}
          # compose cap_add: [NET_ADMIN] (BBR congestion control / TCP send
          # buffer); set silo.capabilities to [] to remove.
          securityContext:
            capabilities:
              add:
                {{- toYaml .Values.silo.capabilities | nindent 16 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: jellyfin
              containerPort: 8096
              protocol: TCP
            - name: audiobookshelf
              containerPort: 13378
              protocol: TCP
          env:
            - name: MODE
              value: integrated
            # The container always listens on these ports; the values under
            # service.ports change only how they are published.
            - name: PORT
              value: "8080"
            - name: JF_PORT
              value: "8096"
            - name: ABS_PORT
              value: "13378"
            - name: PUID
              value: {{ toString .Values.silo.puid | quote }}
            - name: PGID
              value: {{ toString .Values.silo.pgid | quote }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.silo.existingSecret | default (printf "%s-silo-auth" (include "silo.fullname" .)) }}
                  key: {{ .Values.silo.existingSecretKey | default "SECRET_KEY" }}
            {{- if .Values.silo.databaseUrlOverride }}
            - name: DATABASE_URL
              value: {{ .Values.silo.databaseUrlOverride | quote }}
            {{- else if .Values.postgres.auth.existingSecret }}
            # Assembled from the existing secret at render time; the URL
            # (including the password) ends up in the Deployment spec —
            # prefer the chart-managed secret unless you need this branch.
            - name: DATABASE_URL
              value: {{ include "silo.databaseUrl" . | quote }}
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgres-auth" (include "silo.fullname" .) }}
                  key: DATABASE_URL
            {{- end }}
            {{- if .Values.silo.redisUrlOverride }}
            - name: REDIS_URL
              value: {{ .Values.silo.redisUrlOverride | quote }}
            {{- else }}
            - name: REDIS_URL
              value: {{ include "silo.redisUrl" . | quote }}
            {{- end }}
            - name: SILO_PLUGIN_CACHE_DIR
              value: /var/lib/silo/plugins
            - name: POSTGRES_TUNE
              value: {{ .Values.silo.postgresTune | quote }}
            {{- with .Values.silo.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.silo.probes.startup.enabled }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.silo.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.silo.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.silo.probes.readiness.enabled }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.silo.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.silo.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.silo.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.silo.probes.liveness.enabled }}
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.silo.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.silo.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.silo.probes.liveness.failureThreshold }}
          {{- end }}
          volumeMounts:
            {{- range $name, $vol := $.Values.silo.persistence }}
            - name: {{ $name }}
              mountPath: {{ $vol.mountPath }}
              {{- if $vol.readOnly }}
              readOnly: true
              {{- end }}
            {{- end }}
            {{- if .Values.silo.hostProc.enabled }}
            # See values.yaml hostProc: only useful on LXC-backed nodes.
            - name: host-proc-meminfo
              mountPath: /host/proc/meminfo
              readOnly: true
            - name: host-proc-stat
              mountPath: /host/proc/stat
              readOnly: true
            - name: host-proc-loadavg
              mountPath: /host/proc/loadavg
              readOnly: true
            {{- end }}
            {{- if .Values.silo.transcode.vaapi.enabled }}
            - name: vaapi
              mountPath: {{ .Values.silo.transcode.vaapi.mountPath }}
            {{- end }}
            {{- with .Values.silo.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.silo.transcode.nvidia.enabled }}
          # With the NVIDIA claim set here, .Values.silo.resources is ignored
          # (set your own resources map, including nvidia.com/gpu, to override).
          resources:
            {{- if .Values.silo.resources }}
            {{- toYaml .Values.silo.resources | nindent 12 }}
            {{- else }}
            requests:
              nvidia.com/gpu: {{ .Values.silo.transcode.nvidia.count }}
            limits:
              nvidia.com/gpu: {{ .Values.silo.transcode.nvidia.count }}
            {{- end }}
          {{- else if .Values.silo.resources }}
          resources:
            {{- toYaml .Values.silo.resources | nindent 12 }}
          {{- end }}
      volumes:
        {{- range $name, $vol := $.Values.silo.persistence }}
        - name: {{ $name }}
          persistentVolumeClaim:
            claimName: {{ $vol.existingClaim | default (printf "%s-%s" (include "silo.fullname" $) $name) }}
        {{- end }}
        {{- if .Values.silo.hostProc.enabled }}
        - name: host-proc-meminfo
          hostPath:
            path: /proc/meminfo
            type: File
        - name: host-proc-stat
          hostPath:
            path: /proc/stat
            type: File
        - name: host-proc-loadavg
          hostPath:
            path: /proc/loadavg
            type: File
        {{- end }}
        {{- if .Values.silo.transcode.vaapi.enabled }}
        - name: vaapi
          hostPath:
            path: {{ .Values.silo.transcode.vaapi.hostPath }}
            type: Directory
        {{- end }}
        {{- with .Values.silo.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
