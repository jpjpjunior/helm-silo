{{/* Gateway API exposure: an optional chart-managed Gateway plus one
     HTTPRoute for the web UI (and optional ones for the Jellyfin- /
     Audiobookshelf-compatible ports). apiVersion v1 = Gateway API standard
     channel v1.0+ (CRDs must be installed in the cluster). */}}
{{- if .Values.gateway.enabled }}
{{- if .Values.gateway.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "silo.gatewayName" . }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.gateway.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.gateway.gatewayClassName }}
  listeners:
    {{- if .Values.gateway.gateway.listeners }}
    {{- toYaml .Values.gateway.gateway.listeners | nindent 4 }}
    {{- else }}
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "silo.fullname" . }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- include "silo.gatewayParentRefs" . | nindent 4 }}
  hostnames:
    {{- range .Values.gateway.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "silo.fullname" . }}
          port: {{ .Values.service.ports.web.port }}
          weight: 1
      {{- with .Values.gateway.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.gateway.jellyfin.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-jellyfin" (include "silo.fullname" .) }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- include "silo.gatewayParentRefs" . | nindent 4 }}
  hostnames:
    {{- range .Values.gateway.jellyfin.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "silo.fullname" . }}
          port: {{ .Values.service.ports.jellyfin.port }}
          weight: 1
      {{- with .Values.gateway.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.gateway.audiobookshelf.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-audiobookshelf" (include "silo.fullname" .) }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- include "silo.gatewayParentRefs" . | nindent 4 }}
  hostnames:
    {{- range .Values.gateway.audiobookshelf.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "silo.fullname" . }}
          port: {{ .Values.service.ports.audiobookshelf.port }}
          weight: 1
      {{- with .Values.gateway.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
