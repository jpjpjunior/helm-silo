{{/* Opt-in network isolation for the in-cluster datastores (postgres,
     redis/dragonfly, meilisearch): default-deny INGRESS (only this
     release's Silo pods and, when tests.enabled, the helm-test job may
     connect) and default-deny EGRESS (a datastore never initiates
     connections). Requires a CNI that enforces NetworkPolicy (flannel
     does not). networkPolicy.extraIngress / extraEgress (raw NetworkPolicy
     items) are appended to every policy to widen the posture. */}}
{{- if .Values.networkPolicy.enabled }}
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "silo.fullname" . }}-postgres
  labels:
    {{- include "silo.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      {{- include "silo.componentLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "silo.componentLabels" (dict "root" . "component" "silo") | nindent 14 }}
        {{- if .Values.tests.enabled }}
        - podSelector:
            matchLabels:
              {{- include "silo.componentLabels" (dict "root" . "component" "test") | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress: {{ .Values.networkPolicy.extraEgress | default list | toJson }}
{{- end }}
