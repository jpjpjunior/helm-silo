{{- include "silo.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "silo.fullname" . }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
    app.kubernetes.io/component: silo
spec:
  replicas: {{ .Values.silo.replicaCount }}
  strategy:
    type: {{ .Values.silo.updateStrategy }}
  selector:
    matchLabels:
      {{- include "silo.componentLabels" (dict "root" . "component" "silo") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "silo.componentLabels" (dict "root" . "component" "silo") | nindent 8 }}
        {{- with .Values.silo.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $hasSecretChecksum := or (and .Values.silo.secretKey (not .Values.silo.existingSecret)) (and .Values.postgres.enabled .Values.postgres.auth.password (not .Values.postgres.auth.existingSecret)) }}
      {{- if or .Values.silo.podAnnotations $hasSecretChecksum }}
      annotations:
        {{- if and .Values.silo.secretKey (not .Values.silo.existingSecret) }}
        checksum/silo-secret: {{ .Values.silo.secretKey | sha256sum }}
        {{- end }}
        {{- if and .Values.postgres.enabled .Values.postgres.auth.password (not .Values.postgres.auth.existingSecret) }}
        checksum/postgres-secret: {{ .Values.postgres.auth.password | sha256sum }}
        {{- end }}
        {{- with .Values.silo.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "silo.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      # The Silo image's s6-overlay init MUST start as root and then drops
      # privileges to PUID:PGID itself — exactly how the compose stack runs
      # (no `user:`). Forcing runAsUser here makes the init abort with
      # "Started as uid ..., but this image's init needs root".
      # fsGroup still makes PVC mounts group-accessible for PGID.
      securityContext:
        fsGroup: {{ .Values.silo.pgid }}
        {{- with .Values.silo.supplementalGroups }}
        supplementalGroups:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
        {{- if .Values.silo.nonRootMode }}
        runAsUser: {{ .Values.silo.puid }}
        runAsGroup: {{ .Values.silo.pgid }}
        runAsNonRoot: true
        {{- end }}
      # compose stop_grace_period: 2m
      terminationGracePeriodSeconds: {{ .Values.silo.terminationGracePeriodSeconds }}
      {{- if and .Values.silo.transcode.nvidia.enabled .Values.silo.transcode.nvidia.runtimeClassName }}
      runtimeClassName: {{ .Values.silo.transcode.nvidia.runtimeClassName }}
      {{- end }}
      {{- with .Values.silo.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.silo.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.silo.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.silo.initContainers.enabled (or .Values.postgres.enabled .Values.redis.enabled .Values.dragonfly.enabled) }}
      initContainers:
        # compose depends_on: condition: service_healthy
        - name: wait-for-datastores
          image: {{ .Values.silo.initContainers.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL
          command: [sh, -c]
          args:
            - |
              {{- if .Values.postgres.enabled }}
              until nc -z -w2 {{ include "silo.fullname" . }}-postgres 5432; do echo "waiting for postgres..."; sleep 2; done
              {{- end }}
              {{- if or .Values.redis.enabled .Values.dragonfly.enabled }}
              {{- $cacheHost := printf "%s-%s" (include "silo.fullname" .) (.Values.dragonfly.enabled | ternary "dragonfly" "redis") }}
              until nc -z -w2 {{ $cacheHost }} 6379; do echo "waiting for cache backend..."; sleep 2; done
              {{- end }}
              echo "datastores are accepting connections"
      {{- end }}
      containers:
        - name: silo
          image: "{{ .Values.silo.image.repository }}:{{ .Values.silo.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.silo.image.pullPolicy }}
          {{- if .Values.silo.nonRootMode }}
          # Skip the image's s6 init (which needs root) and start the silo
          # binary directly — the image's documented non-root escape hatch.
          # Requires silo.databaseUrlOverride (external PostgreSQL).
          command: [silo]
          {{- end }}
          {{- if or .Values.silo.nonRootMode .Values.silo.dropAllCapabilities .Values.silo.capabilities }}
          # Drop the default capability set, then re-add only what the image
          # needs: the s6 root init chowns data dirs and drops to PUID:PGID
          # (baseline), plus compose cap_add: [NET_ADMIN] for BBR / TCP send
          # buffer. silo.dropAllCapabilities=false keeps the full default
          # set (compose parity); silo.capabilities=[] drops only the extras.
          # In nonRootMode all capabilities are dropped and privilege
          # escalation is disabled to satisfy the `restricted` PSS profile.
          securityContext:
            {{- if .Values.silo.nonRootMode }}
            allowPrivilegeEscalation: false
            {{- end }}
            capabilities:
              {{- if or .Values.silo.nonRootMode .Values.silo.dropAllCapabilities }}
              drop:
                - ALL
              {{- end }}
              {{- if not .Values.silo.nonRootMode }}
              {{- $base := list "CHOWN" "FOWNER" "DAC_OVERRIDE" "SETGID" "SETUID" }}
              {{- $add := .Values.silo.capabilities }}
              {{- if .Values.silo.dropAllCapabilities }}
              {{- $add = concat $base $add }}
              {{- end }}
              {{- if $add }}
              add:
                {{- toYaml $add | nindent 16 }}
              {{- end }}
              {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: jellyfin
              containerPort: 8096
              protocol: TCP
            - name: audiobookshelf
              containerPort: 13378
              protocol: TCP
          env:
            - name: MODE
              value: integrated
            # The container always listens on these ports; the values under
            # service.ports change only how they are published.
            - name: PORT
              value: "8080"
            - name: JF_PORT
              value: "8096"
            - name: ABS_PORT
              value: "13378"
            - name: PUID
              value: {{ toString .Values.silo.puid | quote }}
            - name: PGID
              value: {{ toString .Values.silo.pgid | quote }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.silo.existingSecret | default (printf "%s-silo-auth" (include "silo.fullname" .)) }}
                  key: {{ .Values.silo.existingSecretKey | default "SECRET_KEY" }}
            {{- if .Values.silo.databaseUrlExistingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.silo.databaseUrlExistingSecret }}
                  key: {{ .Values.silo.databaseUrlExistingSecretKey | default "DATABASE_URL" }}
            {{- else if .Values.silo.databaseUrlOverride }}
            - name: DATABASE_URL
              value: {{ .Values.silo.databaseUrlOverride | quote }}
            {{- else if and .Values.postgres.auth.existingSecret .Values.postgres.auth.existingSecretUrlKey }}
            # Taken from the user's secret via valueFrom — the password never
            # enters the rendered pod spec.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.existingSecret }}
                  key: {{ .Values.postgres.auth.existingSecretUrlKey }}
            {{- else if .Values.postgres.auth.existingSecret }}
            # Assembled from the existing secret at render time; the URL
            # (including the password) ends up in the Deployment spec. Set
            # postgres.auth.existingSecretUrlKey to take the URL from your
            # secret via valueFrom instead.
            - name: DATABASE_URL
              value: {{ include "silo.databaseUrl" . | quote }}
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgres-auth" (include "silo.fullname" .) }}
                  key: DATABASE_URL
            {{- end }}
            {{- if .Values.silo.redisUrlExistingSecret }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.silo.redisUrlExistingSecret }}
                  key: {{ .Values.silo.redisUrlExistingSecretKey | default "REDIS_URL" }}
            {{- else if .Values.silo.redisUrlOverride }}
            - name: REDIS_URL
              value: {{ .Values.silo.redisUrlOverride | quote }}
            {{- else }}
            - name: REDIS_URL
              value: {{ include "silo.redisUrl" . | quote }}
            {{- end }}
            - name: SILO_PLUGIN_CACHE_DIR
              value: /var/lib/silo/plugins
            {{- if and .Values.postgres.enabled .Values.silo.postgresTune }}
            - name: POSTGRES_TUNE
              value: {{ .Values.silo.postgresTune | quote }}
            {{- end }}
            {{- with .Values.silo.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.silo.probes.startup.enabled }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.silo.probes.startup.periodSeconds }}
            {{- with .Values.silo.probes.startup.timeoutSeconds }}
            timeoutSeconds: {{ . }}
            {{- end }}
            failureThreshold: {{ .Values.silo.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.silo.probes.readiness.enabled }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.silo.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.silo.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.silo.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.silo.probes.liveness.enabled }}
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.silo.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.silo.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.silo.probes.liveness.failureThreshold }}
          {{- end }}
          volumeMounts:
            {{- range $name := keys $.Values.silo.persistence | sortAlpha }}
            {{- $vol := index $.Values.silo.persistence $name }}
            {{- $enabled := true }}
            {{- if hasKey $vol "enabled" }}
            {{- $enabled = $vol.enabled }}
            {{- end }}
            {{- if $enabled }}
            - name: {{ $name }}
              mountPath: {{ $vol.mountPath }}
              {{- if $vol.readOnly }}
              readOnly: true
              {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.silo.hostProc.enabled }}
            # See values.yaml hostProc: only useful on LXC-backed nodes.
            - name: host-proc-meminfo
              mountPath: /host/proc/meminfo
              readOnly: true
            - name: host-proc-stat
              mountPath: /host/proc/stat
              readOnly: true
            - name: host-proc-loadavg
              mountPath: /host/proc/loadavg
              readOnly: true
            {{- end }}
            {{- if .Values.silo.transcode.vaapi.enabled }}
            - name: vaapi
              mountPath: {{ .Values.silo.transcode.vaapi.mountPath }}
            {{- end }}
            {{- with .Values.silo.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $resources := deepCopy (.Values.silo.resources | default dict) }}
          {{- if .Values.silo.transcode.nvidia.enabled }}
            {{- $req := $resources.requests | default dict }}
            {{- $lim := $resources.limits | default dict }}
            {{- if not (hasKey $req "nvidia.com/gpu") }}
              {{- $_ := set $req "nvidia.com/gpu" .Values.silo.transcode.nvidia.count }}
            {{- end }}
            {{- if not (hasKey $lim "nvidia.com/gpu") }}
              {{- $_ := set $lim "nvidia.com/gpu" .Values.silo.transcode.nvidia.count }}
            {{- end }}
            {{- $_ := set $resources "requests" $req }}
            {{- $_ := set $resources "limits" $lim }}
          {{- end }}
          {{- if $resources }}
          resources:
            {{- toYaml $resources | nindent 12 }}
          {{- end }}
      volumes:
        {{- range $name := keys $.Values.silo.persistence | sortAlpha }}
        {{- $vol := index $.Values.silo.persistence $name }}
        {{- $enabled := true }}
        {{- if hasKey $vol "enabled" }}
        {{- $enabled = $vol.enabled }}
        {{- end }}
        {{- if $enabled }}
        {{- $volType := $vol.type | default "pvc" }}
        - name: {{ $name }}
          {{- if eq $volType "emptyDir" }}
          {{- if or $vol.medium $vol.sizeLimit }}
          emptyDir:
            {{- with $vol.medium }}
            medium: {{ . | quote }}
            {{- end }}
            {{- with $vol.sizeLimit }}
            sizeLimit: {{ . | quote }}
            {{- end }}
          {{- else }}
          emptyDir: {}
          {{- end }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ $vol.existingClaim | default (printf "%s-%s" (include "silo.fullname" $) $name) }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- if .Values.silo.hostProc.enabled }}
        - name: host-proc-meminfo
          hostPath:
            path: /proc/meminfo
            type: File
        - name: host-proc-stat
          hostPath:
            path: /proc/stat
            type: File
        - name: host-proc-loadavg
          hostPath:
            path: /proc/loadavg
            type: File
        {{- end }}
        {{- if .Values.silo.transcode.vaapi.enabled }}
        - name: vaapi
          hostPath:
            path: {{ .Values.silo.transcode.vaapi.hostPath }}
            type: Directory
        {{- end }}
        {{- with .Values.silo.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
