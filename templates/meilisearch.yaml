{{- if .Values.meilisearch.enabled }}
{{- $name := printf "%s-meilisearch" (include "silo.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
    app.kubernetes.io/component: meilisearch
spec:
  # Headless: the StatefulSet's identity service; point Silo's search URL
  # (see README) at this name.
  clusterIP: None
  ports:
    - name: http
      port: 7700
      targetPort: http
      protocol: TCP
  selector:
    {{- include "silo.componentLabels" (dict "root" . "component" "meilisearch") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
    app.kubernetes.io/component: meilisearch
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "silo.componentLabels" (dict "root" . "component" "meilisearch") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "silo.componentLabels" (dict "root" . "component" "meilisearch") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "silo.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.meilisearch.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.meilisearch.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.meilisearch.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: meilisearch
          image: "{{ .Values.meilisearch.image.repository }}:{{ .Values.meilisearch.image.tag }}"
          imagePullPolicy: {{ .Values.meilisearch.image.pullPolicy }}
          {{- if or .Values.meilisearch.dropAllCapabilities .Values.meilisearch.capabilities }}
          # Drop ALL default Linux capabilities; the image runs as its own
          # non-root user, so by default nothing is re-added. Add one via
          # meilisearch.capabilities if an image update ever needs it;
          # dropAllCapabilities: false restores the full default set.
          securityContext:
            capabilities:
              {{- if .Values.meilisearch.dropAllCapabilities }}
              drop:
                - ALL
              {{- end }}
              {{- if .Values.meilisearch.capabilities }}
              add:
                {{- toYaml .Values.meilisearch.capabilities | nindent 16 }}
              {{- end }}
          {{- end }}
          env:
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.meilisearch.existingSecret | default (printf "%s-meilisearch-auth" (include "silo.fullname" .)) }}
                  key: {{ .Values.meilisearch.existingSecretKey | default "MEILI_MASTER_KEY" }}
            - name: MEILI_UPGRADE_DB
              value: {{ toString .Values.meilisearch.upgradeDb | quote }}
            {{- with .Values.meilisearch.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 7700
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /meili_data
          {{- with .Values.meilisearch.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          # Version-stable labels ONLY (see postgres.yaml VCT note).
          {{- include "silo.componentLabels" (dict "root" . "component" "meilisearch") | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.meilisearch.persistence.accessModes | nindent 10 }}
        {{- $sc := include "silo.storageClass" (dict "root" . "storageClass" .Values.meilisearch.persistence.storageClass) }}
        {{- if $sc }}
        storageClassName: {{ $sc | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.meilisearch.persistence.size }}
{{- end }}
