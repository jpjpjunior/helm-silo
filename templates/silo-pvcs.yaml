{{/* One PVC per silo.persistence entry, unless the entry points at an
     existing claim. Key names become the claim suffix (e.g. <fullname>-media). */}}
{{- range $name := keys .Values.silo.persistence | sortAlpha }}
{{- $vol := index $.Values.silo.persistence $name }}
{{- $enabled := true }}
{{- if hasKey $vol "enabled" }}
{{- $enabled = $vol.enabled }}
{{- end }}
{{- $volType := $vol.type | default "pvc" }}
{{- if and $enabled (eq $volType "pvc") (not $vol.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-%s" (include "silo.fullname" $) $name }}
  labels:
    {{- include "silo.labels" $ | nindent 4 }}
    app.kubernetes.io/component: silo
  annotations:
    # Survives helm uninstall — deleting the release must not delete data.
    # Reclaim deliberately afterwards: kubectl delete pvc <name>
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- $vol.accessModes | default (list "ReadWriteOnce") | toYaml | nindent 4 }}
  {{- $sc := include "silo.storageClass" (dict "root" $ "storageClass" $vol.storageClass) }}
  {{- if $sc }}
  storageClassName: {{ $sc | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $vol.size }}
{{- end }}
{{- end }}
