{{- if .Values.redis.enabled }}
{{- $name := printf "%s-redis" (include "silo.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  # Headless: the StatefulSet's identity service; REDIS_URL points here.
  clusterIP: None
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "silo.componentLabels" (dict "root" . "component" "redis") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "silo.componentLabels" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "silo.componentLabels" (dict "root" . "component" "redis") | nindent 8 }}
        {{- with .Values.redis.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.redis.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "silo.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.redis.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.redis.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          # Drop ALL default Linux capabilities, then re-add only what the
          # image entrypoint needs (data-dir chown, gosu privilege drop).
          # dropAllCapabilities: false restores the full default set.
          securityContext:
            allowPrivilegeEscalation: false
            {{- if or .Values.redis.dropAllCapabilities .Values.redis.capabilities }}
            capabilities:
              {{- if .Values.redis.dropAllCapabilities }}
              drop:
                - ALL
              {{- end }}
              {{- if .Values.redis.capabilities }}
              add:
                {{- toYaml .Values.redis.capabilities | nindent 16 }}
              {{- end }}
            {{- end }}
          {{- with .Values.redis.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- with .Values.redis.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          # compose healthcheck: redis-cli ping, 5s/3s/5 tries
          startupProbe:
            exec:
              command: [sh, -c, redis-cli ping]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [sh, -c, redis-cli ping]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            exec:
              command: [sh, -c, redis-cli ping]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          # Version-stable labels ONLY (see postgres.yaml VCT note).
          {{- include "silo.componentLabels" (dict "root" . "component" "redis") | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.redis.persistence.accessModes | nindent 10 }}
        {{- $sc := include "silo.storageClass" (dict "root" . "storageClass" .Values.redis.persistence.storageClass) }}
        {{- if $sc }}
        storageClassName: {{ $sc | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
{{- end }}
