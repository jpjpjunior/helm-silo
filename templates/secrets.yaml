{{/* Chart-managed credentials. User-supplied secrets (silo.existingSecret,
     postgres.auth.existingSecret, meilisearch.existingSecret) are never
     created or modified here. */}}
{{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-postgres-auth" (include "silo.fullname" .) }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  postgres-password: {{ include "silo.postgresPassword" . | quote }}
  DATABASE_URL: {{ include "silo.databaseUrl" . | quote }}
{{- end }}
{{- if .Values.silo.secretKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-silo-auth" (include "silo.fullname" .) }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
    app.kubernetes.io/component: silo
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.silo.secretKey | quote }}
{{- end }}
{{- if and .Values.meilisearch.enabled .Values.meilisearch.masterKey (not .Values.meilisearch.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-meilisearch-auth" (include "silo.fullname" .) }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
    app.kubernetes.io/component: meilisearch
type: Opaque
stringData:
  MEILI_MASTER_KEY: {{ .Values.meilisearch.masterKey | quote }}
{{- end }}
