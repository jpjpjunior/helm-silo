apiVersion: v2
name: silo
description: |
  Silo media server with Jellyfin- and Audiobookshelf-compatible endpoints,
  plus in-cluster PostgreSQL (pgvector), Redis (or DragonflyDB) and optional
  Meilisearch — converted from the upstream docker-compose.advanced.yml
  multi-container layout into a single self-contained chart.
type: application
version: 0.4.0
appVersion: "latest"
kubeVersion: ">=1.25.0-0"
home: https://siloserver.org
keywords:
  - media
  - streaming
  - jellyfin
  - audiobookshelf
  - postgresql
  - redis
  - dragonflydb
  - meilisearch
maintainers: [] # add yourself before publishing to a chart repo / Artifact Hub
annotations:
  category: Media
