name: chart

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: helm lint (exercises values.schema.json + NOTES.txt)
        run: helm lint . -f ci/test-values/a-defaults.yaml
      - name: chart validator (render scenarios + assertions)
        run: |
          pip install pyyaml
          python ci/validate_chart.py
      - name: kubeconform (strict, missing CRD schemas ignored)
        run: |
          curl -sSLo /tmp/kc.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /tmp
          for f in a-defaults b-meili c-external d-gpu f-gateway-external g-gateway-create j-dragonfly; do
            echo "=== kubeconform: ${f} ==="
            helm template rel . -f "ci/test-values/${f}.yaml" \
              | /tmp/kubeconform -strict -ignore-missing-schemas
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: tag matches Chart.yaml version
        run: |
          chart_version=$(awk '/^version:/{print $2}' Chart.yaml)
          test "v${chart_version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${chart_version}"; exit 1; }
      - name: package + publish to gh-pages
        run: |
          mkdir -p /tmp/pkg
          helm package . -d /tmp/pkg
          git config user.name "chart-bot"
          git config user.email "chart-bot@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add gh-pages origin/gh-pages
          cp /tmp/pkg/silo-*.tgz gh-pages/
          ( cd gh-pages && helm repo index . --merge index.yaml --url https://jpjpjunior.github.io/helm-silo \
            && git add -A && git commit -m "gh-pages: add ${GITHUB_REF_NAME}" \
            && git push origin gh-pages )
