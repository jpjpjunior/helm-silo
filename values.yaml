# Default values for the silo chart.
# Every default mirrors docker-compose.advanced.yml so that a stock
# `helm install` behaves like the compose stack with SILO defaults.

# -- Override the chart name part of resource names.
nameOverride: ""

# -- Override the full release-scoped name (used in every resource name and
# in the in-cluster service DNS names).
fullnameOverride: ""

# -- Storage class for ALL PersistentVolumeClaims (chart default, stateful
# sets and silo mounts). Leave empty to use the cluster's default storage
# class. A per-claim `storageClass` overrides this.
storageClass: ""

# -- Image pull secrets for every component.
imagePullSecrets: []

serviceAccount:
  create: true
  # -- Explicit SA name; defaults to the release fullname.
  name: ""
  annotations: {}
  # Silo never talks to the Kubernetes API.
  automountServiceAccountToken: false

# ---------------------------------------------------------------------------
# Network isolation (opt-in). Creates default-deny-ingress NetworkPolicies
# for the in-cluster datastores (postgres, redis/dragonfly, meilisearch) and
# allows traffic only from this release's Silo pods in the same namespace.
# Requires a CNI that enforces NetworkPolicy (Calico/Cilium/... do; flannel
# does NOT). Raw NetworkPolicy `ingress` items appended to every datastore
# policy via extraIngress allow more sources (admin pods, monitoring).
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: false
  extraIngress: []
  # -- Raw NetworkPolicy `egress` items appended to every datastore policy
  # (default: deny-all egress — a datastore never initiates connections).
  # E.g. allow cluster DNS if an image ever needs to resolve names:
  #   - to:
  #       - namespaceSelector:
  #           matchLabels: { kubernetes.io/metadata.name: kube-system }
  #     ports: [{ protocol: UDP, port: 53 }]
  extraEgress: []

# ---------------------------------------------------------------------------
# `helm test <release>` hook: a small busybox Job that TCP-checks the Silo
# service and the enabled datastores (mirrors the wait-for-datastores
# init container).
# ---------------------------------------------------------------------------
tests:
  enabled: true
  image: busybox:1.36

# ---------------------------------------------------------------------------
# PostgreSQL (pgvector image, as in compose)
# ---------------------------------------------------------------------------
postgres:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg18
    pullPolicy: IfNotPresent
  auth:
    username: silo
    database: silo
    # -- Empty => the chart generates a random password on first install and
    # keeps it stable across upgrades (stored in <fullname>-postgres-auth).
    password: ""
    # -- Use your own Secret instead; it must contain the key below. When
    # set, `password` is ignored and DATABASE_URL is assembled from it at
    # render time.
    existingSecret: ""
    existingSecretPasswordKey: postgres-password
    # -- Key in `existingSecret` holding the FULL postgres:// URL. When set,
    # the Deployment takes DATABASE_URL from that secret via valueFrom and
    # the password never appears in the pod spec. Leave empty to keep the
    # legacy render-time assembly (URL, password included, visible in the
    # pod spec).
    existingSecretUrlKey: ""
  # -- Drop ALL default Linux capabilities, then re-add only what the image
  # entrypoint needs (data-dir chown, gosu privilege drop). Removes the
  # risky Docker defaults (NET_RAW, SYS_CHROOT, MKNOD, AUDIT_WRITE, ...).
  # Set false for the full default set (compose parity).
  dropAllCapabilities: true
  capabilities:
    - CHOWN
    - FOWNER
    - SETGID
    - SETUID
  # -- compose `shm_size: 8gb`: mounted as a tmpfs (emptyDir medium: Memory)
  # at /dev/shm. Empty string mounts it without a size limit.
  shmSize: 8Gi
  # -- compose `command:` for the postgres container.
  args:
    - postgres
    - -c
    - listen_addresses=*
    - -c
    - shared_preload_libraries=pg_stat_statements
  persistence:
    size: 20Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  extraEnv: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Redis
# ---------------------------------------------------------------------------
redis:
  enabled: true
  image:
    repository: redis
    # Pinned minor: the floating `alpine` tag crosses majors without
    # warning (chart pins dragonfly/meilisearch for the same reason).
    # Bump deliberately.
    tag: 8.4-alpine
    pullPolicy: IfNotPresent
  # -- Drop ALL default Linux capabilities, then re-add only what the image
  # entrypoint needs (data-dir chown, gosu privilege drop). Set false for
  # the full default set (compose parity).
  dropAllCapabilities: true
  capabilities:
    - CHOWN
    - FOWNER
    - SETGID
    - SETUID
  persistence:
    size: 8Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  extraEnv: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# DragonflyDB (optional Redis replacement — Redis wire-compatible)
# ---------------------------------------------------------------------------
dragonfly:
  enabled: false
  image:
    repository: docker.dragonflydb.io/dragonflydb/dragonfly
    # Pinned to the last BSL 1.1 release: with v2.1 (2026-11) Dragonfly
    # moved to a source-available license. Bump deliberately.
    tag: v2.0.2
    pullPolicy: IfNotPresent
  # -- Drop ALL default Linux capabilities; the image execs the server
  # directly (no chown/privilege-drop entrypoint), so nothing is re-added.
  # Set false for the full default set (compose parity).
  dropAllCapabilities: true
  capabilities: []
  # -- Dragonfly server flags. --proactor_threads=1 is deliberate: Dragonfly
  # sizes its thread pool from the NODE's core count, not the container's
  # CPU limit, so on a many-core node it would otherwise spawn dozens of
  # threads. To make it behave like a pure cache (evict near the limit,
  # Redis allkeys-lru style) add: --maxmemory=6Gi --cache_mode=true — but
  # beware: eviction also drops queue/job state Silo keeps in this backend.
  args:
    - --alsologtostderr
    - --proactor_threads=1
  persistence:
    size: 8Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  extraEnv: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Meilisearch (compose `profiles: [search]` -> disabled by default)
# ---------------------------------------------------------------------------
meilisearch:
  enabled: false
  image:
    repository: getmeili/meilisearch
    # Pinned: Meilisearch will not open data written by another version.
    # Bump deliberately, together with upgradeDb.
    tag: v1.54.0
    pullPolicy: IfNotPresent
  # -- Drop ALL default Linux capabilities; the image runs as its own
  # non-root user, so nothing is re-added. Set false for the full default
  # set (compose parity).
  dropAllCapabilities: true
  capabilities: []
  # -- Master key; required when enabled (fail-fast, like the compose
  # entrypoint). Prefer existingSecret for production.
  masterKey: ""
  existingSecret: ""
  existingSecretKey: MEILI_MASTER_KEY
  # -- compose MEILI_UPGRADE_DB.
  upgradeDb: false
  persistence:
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  extraEnv: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Silo
# ---------------------------------------------------------------------------
silo:
  # -- Must stay 1: Silo is a single-instance server backed by ReadWriteOnce
  # volumes (the chart fails rendering above 1).
  replicaCount: 1
  image:
    repository: ghcr.io/silo-server/silo-server
    tag: latest
    # :latest + IfNotPresent leaves stale images behind on upgrades, so the
    # default is Always. Pin a version tag for reproducible deploys.
    pullPolicy: Always

  # -- The account Silo runs as after startup; drives the PUID/PGID env
  # vars and fsGroup. The image's s6-overlay init must start as ROOT and
  # drops privileges to PUID:PGID itself (exactly like the compose file, so
  # the pod deliberately runs as root at first). Needs read access to the
  # media. With silo.nonRootMode=true the values become runAsUser/runAsGroup.
  puid: 1000
  pgid: 1000

  # -- Skip the image's s6 init (which needs root) and run the `silo` binary
  # directly as PUID:PGID (runAsNonRoot: true) — for clusters enforcing the
  # `restricted` pod-security profile. Per the image's own docs this mode
  # requires an external PostgreSQL, so silo.databaseUrlOverride must be set;
  # the chart fails rendering otherwise.
  nonRootMode: false

  # -- REQUIRED (unless silo.secretKey is set): name of an existing Secret
  # holding the at-rest credential encryption master key.
  # Create: openssl rand -base64 48
  #         kubectl create secret generic silo-secrets \
  #           --from-literal=SECRET_KEY='<generated key>'
  # Back it up apart from your database dumps; without it, encrypted secrets
  # cannot be recovered.
  existingSecret: ""
  existingSecretKey: SECRET_KEY
  # -- Direct value alternative (chart stores it in <fullname>-silo-auth).
  # Convenient for trials; use existingSecret for production.
  secretKey: ""

  # -- compose POSTGRES_TUNE. Used when the in-cluster postgres is enabled.
  postgresTune: auto

  # -- Full postgres:// URL override. Required when postgres.enabled=false
  # (e.g. an external CloudNativePG cluster).
  databaseUrlOverride: ""
  # -- Full redis:// URL override. Required when redis.enabled=false.
  redisUrlOverride: ""

  # -- compose `stop_grace_period: 2m`: on stop Silo fails readiness, keeps
  # serving for SILO_SHUTDOWN_DELAY (default 5s), then finishes in-flight
  # requests. A single server with no load balancer in front can set the
  # app-level delay to 0 via extraEnv: [{name: SILO_SHUTDOWN_DELAY, value: "0"}].
  terminationGracePeriodSeconds: 120

  # -- RollingUpdate is unsafe with ReadWriteOnce PVCs (the new pod cannot
  # mount while the old one still holds the volume): default Recreate.
  updateStrategy: Recreate

  # -- compose `cap_add: [NET_ADMIN]`: lets Silo use kernel BBR congestion
  # control and a larger TCP send buffer for remote clients on long, fast
  # links (a startup helper holds it only until the listeners are
  # configured). Set to [] to remove, mirroring "Undo: remove this line" in
  # the compose file. SILO_NET_TCP_CONGESTION=off /
  # SILO_NET_TCP_SEND_BUFFER=off (via extraEnv) turn each part off
  # individually. These are ADDED BACK on top of the init baseline when
  # dropAllCapabilities is true.
  capabilities:
    - NET_ADMIN

  # -- Drop ALL default Linux capabilities first (recommended: removes the
  # risky image defaults like NET_RAW, SYS_CHROOT, MKNOD, AUDIT_WRITE),
  # then re-add the baseline the image's root s6 init needs (CHOWN,
  # FOWNER, DAC_OVERRIDE, SETGID, SETUID) plus `capabilities` above. In
  # nonRootMode the baseline is skipped (nothing runs as root). Set false
  # for the full default capability set (compose parity).
  dropAllCapabilities: true

  transcode:
    # -- Intel/AMD hardware transcoding (VA-API / Quick Sync): mounts a
    # hostPath at the container, like compose `devices: [/dev/dri:/dev/dri]`.
    vaapi:
      enabled: false
      hostPath: /dev/dri
      mountPath: /dev/dri
    # -- NVIDIA: requires the NVIDIA container runtime on the nodes; sets
    # runtimeClassName and injects an nvidia.com/gpu request/limit (compose
    # capabilities: [gpu, compute, utility, video]) unless silo.resources
    # is set — then your resources map is used as-is.
    nvidia:
      enabled: false
      count: 1
      runtimeClassName: nvidia

  # -- Mounts /proc/{meminfo,stat,loadavg} from the node read-only into
  # /host/proc/* so CPU, load and memory report this pod's share instead of
  # the node's. Only useful when the Kubernetes nodes are themselves LXC
  # containers (common on some home-lab setups); on bare metal/VMs the same
  # files are what Silo reads anyway. Requires hostPath permissions
  # (disallowed under the `restricted` pod-security profile), so it is off
  # by default.
  hostProc:
    enabled: false

  # -- tcpSocket probes against the always-open 8080 listener (the compose
  # file defines no HTTP healthcheck for Silo, so none is invented here).
  probes:
    startup:
      enabled: true
      periodSeconds: 2
      failureThreshold: 90
    readiness:
      enabled: true
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      enabled: true
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3

  # -- initContainer that waits for the in-cluster postgres/redis to accept
  # TCP connections (compose `depends_on: condition: service_healthy`).
  initContainers:
    enabled: true
    image: busybox:1.36

  # -- Persistent data. Every entry becomes its own PVC (or uses
  # existingClaim); `storageClass: ""` falls back to the top-level one.
  persistence:
    # Host media, mounted read-only like compose `${MEDIA_ROOT}:...:ro`.
    media:
      size: 100Gi
      storageClass: ""
      existingClaim: ""
      mountPath: /mnt/media
      readOnly: true
    # Ownership taken by Silo on start; survives image updates.
    plugins:
      size: 1Gi
      mountPath: /var/lib/silo/plugins
    artwork:
      size: 10Gi
      mountPath: /var/lib/silo/artwork
    # Dedicated volume for Silo's own backups. Deliberately not squeezed
    # onto a 1Gi data claim: the pre-migration backup guard refuses to run
    # migrations unless 1.5x the previous backup + 1GB is free at the
    # destination, which a 1Gi claim cannot honor once a few backups exist.
    # Point Silo at this mount in Settings > Backups (backup destination).
    # Grow via `size` BEFORE the volume fills — PVCs never shrink, and a
    # chart size below the live claim fails `helm upgrade` with a
    # forbidden-shrink error. Bring your own claim with existingClaim;
    # retention/pruning stays the app's job (Settings > Backups).
    backups:
      size: 20Gi
      mountPath: /var/lib/silo/backups
    compat:
      size: 1Gi
      mountPath: /var/lib/silo/compat
    transcode:
      size: 10Gi
      mountPath: /tmp/silo-transcode
    # Prepared downloads; no storage budget applies until you set one
    # (download.artifact_max_bytes in Settings > Downloads).
    download-artifacts:
      size: 10Gi
      mountPath: /tmp/silo-download-artifacts
    catalog-seeds:
      size: 1Gi
      mountPath: /catalog-seeds
      readOnly: true

  # -- Arbitrary extra env vars for the Silo container, e.g. the .env server
  # settings the compose file loads from env_file (.env.example lists them:
  # SILO_PUBLIC_URL, SILO_SMTP_HOST, ...) and the search wiring:
  #   extraEnv:
  #     - name: <search URL var per Silo's docs>
  #       value: http://<release>-meilisearch:7700
  extraEnv: []

  extraVolumes: []
  extraVolumeMounts: []

  podAnnotations: {}
  podLabels: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# Exposure: one Service carrying all three listener ports
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  # -- e.g. cloud LoadBalancer annotations.
  annotations: {}
  # -- "" | Cluster | Local (only meaningful for NodePort/LoadBalancer).
  externalTrafficPolicy: ""
  # Port defaults mirror the compose host-side defaults. targetPort refers
  # to the named container ports (the container always listens on
  # 8080/8096/13378).
  ports:
    web:
      port: 8090
      targetPort: http
    jellyfin:
      port: 8096
      targetPort: jellyfin
    audiobookshelf:
      port: 13378
      targetPort: audiobookshelf

# ---------------------------------------------------------------------------
# Gateway API (gateway.networking.k8s.io/v1) — the modern replacement for
# Ingress. Requires the Gateway API CRDs (standard channel, v1.0+) to be
# installed in the cluster; they ship with neither Kubernetes nor this chart.
# ---------------------------------------------------------------------------
gateway:
  enabled: false
  # -- Hostnames for the web UI HTTPRoute (required when enabled).
  hostnames: []
  # -- parentRefs to attach the HTTPRoutes to. Leave empty when
  # gateway.gateway.create=true (the chart wires them to its own Gateway);
  # otherwise required, e.g.:
  #   parentRefs:
  #     - name: my-gateway
  #       namespace: gateway-system   # optional
  #       sectionName: https          # optional, targets one listener
  parentRefs: []
  # -- Chart-managed Gateway. gatewayClassName must reference a
  # GatewayClass already installed in the cluster.
  gateway:
    create: false
    gatewayClassName: ""
    # -- Raw listeners list for the created Gateway. Default: one plain
    # HTTP listener on port 80 allowing routes from the release namespace.
    # Override to add TLS, e.g.:
    #   listeners:
    #     - name: https
    #       port: 443
    #       protocol: HTTPS
    #       tls:
    #         mode: Terminate
    #         certificateRefs:
    #           - group: ""
    #             kind: Secret
    #             name: my-cert
    #       allowedRoutes:
    #         namespaces:
    #           from: Same
    listeners: []
  # -- Optional extra HTTPRoutes for the Jellyfin- / Audiobookshelf-
  # compatible ports. Client apps usually expect a dedicated hostname (not a
  # path prefix), so each gets its own hostname(s) and route.
  jellyfin:
    enabled: false
    hostnames: []
  audiobookshelf:
    enabled: false
    hostnames: []
